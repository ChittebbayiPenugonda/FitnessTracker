<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#111827">
  <link rel="manifest" href="manifest.json">
  <title>GymLog</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ── Auth Screen ── -->
  <div id="auth-screen" class="screen">
    <div class="auth-container">
      <div class="auth-logo">⟳</div>
      <h1>GymLog</h1>
      <p class="auth-sub">Progressive overload tracker</p>
      <button id="google-signin-btn" class="btn-primary btn-large">Sign in with Google</button>
    </div>
  </div>

  <!-- ── Exercise List Screen ── -->
  <div id="list-screen" class="screen hidden">
    <header class="top-bar">
      <h1>GymLog</h1>
      <button id="analytics-btn" class="text-btn">Stats</button>
      <button id="profile-btn" class="profile-btn" aria-label="Profile"></button>
    </header>
    <div id="tab-bar" class="tab-bar"></div>
    <div id="exercise-list" class="list-container">
      <div class="state-msg">Loading…</div>
    </div>
    <button id="add-exercise-fab" class="fab" aria-label="Add exercise">+</button>
  </div>

  <!-- ── Analytics Screen ── -->
  <div id="analytics-screen" class="screen hidden">
    <header class="top-bar">
      <button id="analytics-back-btn" class="icon-btn">←</button>
      <h1>Stats</h1>
    </header>
    <div class="analytics-body">
      <div class="cal-nav">
        <button id="cal-prev-btn" class="icon-btn">←</button>
        <span id="cal-month-label"></span>
        <button id="cal-next-btn" class="icon-btn">→</button>
      </div>
      <div id="calendar-grid" class="calendar-grid"></div>
      <div id="analytics-legend" class="analytics-legend"></div>
    </div>
  </div>

  <!-- ── Exercise Detail Screen ── -->
  <div id="detail-screen" class="screen hidden">
    <header class="top-bar">
      <button id="back-btn" class="icon-btn">←</button>
      <h1 id="detail-name" class="truncate">Exercise</h1>
      <button id="detail-log-btn" class="btn-accent">Log</button>
    </header>
    <div class="chart-wrapper">
      <canvas id="progress-chart"></canvas>
      <div id="chart-empty" class="chart-empty hidden">No logs yet — start logging!</div>
    </div>
    <div class="detail-meta">
      <div id="detail-group-chips" class="group-chips"></div>
      <button id="move-exercise-btn" class="text-btn">Move to…</button>
    </div>
    <div id="log-list" class="log-list">
      <div class="state-msg">Loading…</div>
    </div>
    <button id="delete-exercise-btn" class="delete-exercise-btn">Delete Exercise</button>
  </div>

  <!-- ── Log Modal ── -->
  <div id="log-modal" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal">
      <h2 id="log-modal-title">Log Set</h2>
      <div id="strength-inputs">
        <div class="field">
          <label>Weight</label>
          <div class="stepper">
            <button class="step-btn" data-target="weight-input" data-step="-5">−</button>
            <input type="number" id="weight-input" value="45" min="0" step="any" inputmode="decimal">
            <button class="step-btn" data-target="weight-input" data-step="5">+</button>
          </div>
          <div class="unit-toggle">
            <button class="unit-btn active" data-unit="lbs">lbs</button>
            <button class="unit-btn" data-unit="kg">kg</button>
          </div>
        </div>
        <div class="field">
          <label>Reps</label>
          <div class="stepper">
            <button class="step-btn" data-target="reps-input" data-step="-1">−</button>
            <input type="number" id="reps-input" value="8" min="1" step="1" inputmode="numeric">
            <button class="step-btn" data-target="reps-input" data-step="1">+</button>
          </div>
        </div>
      </div>
      <div id="cardio-inputs" class="hidden">
        <div class="field">
          <label>Duration</label>
          <div class="duration-row">
            <div class="duration-group">
              <div class="stepper">
                <button class="step-btn" data-target="minutes-input" data-step="-1">−</button>
                <input type="number" id="minutes-input" value="20" min="0" inputmode="numeric">
                <button class="step-btn" data-target="minutes-input" data-step="1">+</button>
              </div>
              <span class="duration-label">min</span>
            </div>
            <div class="duration-group">
              <div class="stepper">
                <button class="step-btn" data-target="seconds-input" data-step="-10">−</button>
                <input type="number" id="seconds-input" value="0" min="0" max="59" inputmode="numeric">
                <button class="step-btn" data-target="seconds-input" data-step="10">+</button>
              </div>
              <span class="duration-label">sec</span>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-actions">
        <button id="cancel-log-btn" class="btn-secondary">Cancel</button>
        <button id="save-log-btn" class="btn-primary">Save</button>
      </div>
    </div>
  </div>

  <!-- ── Add Exercise Modal ── -->
  <div id="add-modal" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal">
      <h2>New Exercise</h2>
      <input type="text" id="new-exercise-input" placeholder="e.g. Bench Press"
             class="text-input" autocomplete="off" autocorrect="off" spellcheck="false">
      <div class="field">
        <label>Type</label>
        <div class="type-toggle">
          <button class="type-opt active" data-type="strength">Strength</button>
          <button class="type-opt" data-type="cardio">Cardio</button>
        </div>
      </div>
      <div class="field">
        <label>Group</label>
        <div class="group-picker" id="group-picker"></div>
      </div>
      <div class="modal-actions">
        <button id="cancel-add-btn" class="btn-secondary">Cancel</button>
        <button id="save-exercise-btn" class="btn-primary">Add</button>
      </div>
    </div>
  </div>

  <!-- ── Manage Groups Modal ── -->
  <div id="manage-groups-modal" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal">
      <h2>Groups</h2>
      <div id="manage-groups-list" class="manage-groups-list"></div>
      <div class="field">
        <label>New Group</label>
        <input type="text" id="new-group-input" placeholder="e.g. Push Day"
               class="text-input" autocomplete="off" style="margin-bottom:0">
      </div>
      <div class="modal-actions" style="margin-top:16px">
        <button id="cancel-manage-groups-btn" class="btn-secondary">Done</button>
        <button id="save-new-group-btn" class="btn-primary">Add</button>
      </div>
    </div>
  </div>

  <!-- ── Edit Log Modal ── -->
  <div id="edit-log-modal" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal">
      <h2>Edit Log</h2>
      <div id="edit-strength-inputs">
        <div class="field">
          <label>Weight</label>
          <div class="stepper">
            <button class="step-btn" data-target="edit-weight-input" data-step="-5">−</button>
            <input type="number" id="edit-weight-input" value="45" min="0" step="any" inputmode="decimal">
            <button class="step-btn" data-target="edit-weight-input" data-step="5">+</button>
          </div>
          <div class="unit-toggle" id="edit-unit-toggle">
            <button class="edit-unit-btn unit-btn active" data-unit="lbs">lbs</button>
            <button class="edit-unit-btn unit-btn" data-unit="kg">kg</button>
          </div>
        </div>
        <div class="field">
          <label>Reps</label>
          <div class="stepper">
            <button class="step-btn" data-target="edit-reps-input" data-step="-1">−</button>
            <input type="number" id="edit-reps-input" value="8" min="1" step="1" inputmode="numeric">
            <button class="step-btn" data-target="edit-reps-input" data-step="1">+</button>
          </div>
        </div>
      </div>
      <div id="edit-cardio-inputs" class="hidden">
        <div class="field">
          <label>Duration</label>
          <div class="duration-row">
            <div class="duration-group">
              <div class="stepper">
                <button class="step-btn" data-target="edit-minutes-input" data-step="-1">−</button>
                <input type="number" id="edit-minutes-input" value="20" min="0" inputmode="numeric">
                <button class="step-btn" data-target="edit-minutes-input" data-step="1">+</button>
              </div>
              <span class="duration-label">min</span>
            </div>
            <div class="duration-group">
              <div class="stepper">
                <button class="step-btn" data-target="edit-seconds-input" data-step="-10">−</button>
                <input type="number" id="edit-seconds-input" value="0" min="0" max="59" inputmode="numeric">
                <button class="step-btn" data-target="edit-seconds-input" data-step="10">+</button>
              </div>
              <span class="duration-label">sec</span>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-actions">
        <button id="cancel-edit-log-btn" class="btn-secondary">Cancel</button>
        <button id="save-edit-log-btn" class="btn-primary">Save</button>
      </div>
      <button id="delete-log-btn" class="delete-exercise-btn" style="margin-top:8px;border-radius:10px">Delete This Log</button>
    </div>
  </div>

  <!-- ── Move Exercise Modal ── -->
  <div id="move-modal" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal">
      <h2>Move to Group</h2>
      <div id="move-group-list" class="move-group-list"></div>
      <button id="cancel-move-btn" class="btn-secondary" style="width:100%;margin-top:8px">Cancel</button>
    </div>
  </div>

  <!-- ── Profile Modal ── -->
  <div id="profile-modal" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="profile-header">
        <div class="profile-avatar" id="profile-avatar-large"></div>
        <div>
          <div class="profile-name" id="profile-display-name"></div>
          <div class="profile-email" id="profile-display-email"></div>
        </div>
      </div>
      <button id="open-settings-btn" class="profile-action-btn">⚙ Settings</button>
      <button id="signout-btn" class="profile-action-btn danger">↪ Sign out</button>
    </div>
  </div>

  <!-- ── Settings Modal ── -->
  <div id="settings-modal" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal">
      <h2>Settings</h2>
      <div class="field">
        <label>Theme</label>
        <div class="theme-picker" id="theme-picker"></div>
      </div>
      <button id="close-settings-btn" class="btn-secondary" style="width:100%">Done</button>
    </div>
  </div>

  <!-- Firebase + Chart.js -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
